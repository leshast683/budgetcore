<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · BudgetCore</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .reset-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 1.5rem;
    }
    .reset-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 380px;
    }
  </style>
</head>
<body>
  <div class="reset-page">
    <div class="reset-card">
      <form class="auth-form" id="reset-form" novalidate>
        <img src="budgetly.png" alt="BudgetCore" class="auth-form-logo" />
        <h2 class="auth-form-title">Set a New Password</h2>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:0.25rem">Enter a new password for your account.</p>

        <div class="password-wrapper">
          <input type="password" id="reset-password" class="auth-input" placeholder="New password" autocomplete="new-password" required />
        </div>
        <input type="password" id="reset-confirm" class="auth-input" placeholder="Confirm new password" autocomplete="new-password" required />

        <p class="auth-error" id="reset-error"></p>

        <button type="submit" class="btn btn-full" id="reset-submit">Update Password</button>
      </form>
    </div>
  </div>

  <script type="module" src="reset-password.js"></script>
</body>
</html>
