<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Icon background circle -->
  <circle cx="40" cy="40" r="34" fill="url(#iconGrad)"/>

  <!-- Wallet body -->
  <rect x="18" y="28" width="30" height="22" rx="3" fill="white" opacity="0.95"/>
  <!-- Wallet flap -->
  <rect x="18" y="24" width="30" height="9" rx="3" fill="white" opacity="0.7"/>
  <!-- Wallet pocket -->
  <rect x="37" y="33" width="11" height="11" rx="2" fill="url(#iconGrad)" stroke="white" stroke-width="1.5"/>
  <!-- Coin dot in pocket -->
  <circle cx="42.5" cy="38.5" r="3" fill="white" opacity="0.9"/>

  <!-- Trending arrow (top right of icon) -->
  <polyline points="24,46 30,40 35,44 44,34" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>

  <!-- App name -->
  <text x="86" y="47" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1e293b" letter-spacing="-0.5">Budget</text>
  <text x="195" y="47" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#22c55e" letter-spacing="-0.5">ly</text>

  <!-- Tagline -->
  <text x="87" y="62" font-family="'DM Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" letter-spacing="0.5">PERSONAL FINANCE</text>
</svg>
